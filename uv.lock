    { name = "httpx", specifier = "==0.28.1" },
    { name = "huggingface-hub", specifier = "==1.33.0" },
    { name = "peft", specifier = "==0.21.2" },
    { name = "psutil", specifier = "==7.2.2" },
    { name = "python-dotenv", specifier = "==1.2.3" },
    { name = "regex", specifier = "==2026.9.29" },
